[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-auto-route"
version = "0.1.0"
description = "Automatic OD route planner for urban UAV logistics missions."
readme = "SKILL.md"
requires-python = ">=3.10"
dependencies = [
    "folium>=0.20,<1",
    "pyproj>=3.7,<4",
    "shapely>=2.1,<3",
    "GDAL>=3.12.1,<3.12.2",
    "xlrd>=2.0,<3",
    "msoffcrypto-tool>=5.4,<6",
]

[tool.setuptools]
py-modules = []
